    <!--
      Iterator Helpers polyfill guard.
      pdfjs-dist@6 (и ряд других зависимостей) обращается к `Iterator.prototype`
      напрямую, предполагая наличие глобального `Iterator` (ES2025 Iterator Helpers).
      Он есть в Chrome 122+/Safari 18.4+/Firefox 131+, но отсутствует в:
        - iOS/iPadOS Safari <= 17.x (например 17.5.1)
        - старых Android WebView / Samsung Internet
        - встроенных браузерах ряда мобильных приложений
      Без этой заглушки бандл падает с `ReferenceError: Can't find variable: Iterator`
      ещё до маунта React, и пользователь видит бесконечный лоадер.
      Ставим МИНИМАЛЬНЫЙ shim: пустой конструктор с prototype — этого достаточно,
      чтобы `Iterator.prototype.join = …` и подобные присваивания отработали.
    -->
    <script>
      (function () {
        try {
          if (typeof globalThis.Iterator === "undefined") {
            var Shim = function Iterator() {};
            Shim.prototype = Object.create(null);
            globalThis.Iterator = Shim;
          }
        } catch (e) {}
      })();
    </script>

    <script>

      (function () {
        function isAssetCss(link) {
          return link && link.rel === "stylesheet" && link.href && link.href.indexOf("/assets/") !== -1;
        }

        function retry(link) {
          if (link.dataset.rlRetried) return;
          link.dataset.rlRetried = "true";
          try {
            console.warn("[RL] CSS load failed, retrying:", link.href);
            var separator = link.href.indexOf("?") === -1 ? "?" : "&";
            var newLink = document.createElement("link");
            newLink.rel = "stylesheet";
            newLink.href = link.href + separator + "retry=" + Date.now();
            if (link.crossOrigin) newLink.crossOrigin = link.crossOrigin;
            if (link.parentNode) link.parentNode.insertBefore(newLink, link.nextSibling);
          } catch (e) {
            // If retry fails, leave the original link for inspection.
          }
        }

        function watch(link) {
          if (!isAssetCss(link) || link.dataset.rlWatched) return;
          link.dataset.rlWatched = "true";
          link.addEventListener("error", function () { retry(link); }, { once: true });
        }

        var links = document.querySelectorAll('link[rel="stylesheet"]');
        for (var i = 0; i < links.length; i++) watch(links[i]);

        if ("MutationObserver" in window) {
          new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var added = mutations[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                if (added[j].tagName === "LINK") watch(added[j]);
              }
            }
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>

    <script>
      (function () {
        var startTs = Date.now();
        var pending = new Map(); // url -> { start, kind }
        var errors = []; // { msg, src }
        var seq = 0;

        function shortUrl(u) {
          try {
            var url = new URL(u, location.href);
            var path = url.pathname + (url.search || '');
            if (path.length > 80) path = path.slice(0, 40) + '…' + path.slice(-30);
            return (url.host === location.host ? '' : url.host) + path;
          } catch (e) { return String(u).slice(0, 100); }
        }
        function track(url, kind) {
          if (!url) return null;
          var key = (seq++) + ':' + url;
          pending.set(key, { url: url, kind: kind, start: Date.now() });
          return key;
        }
        function untrack(key) { if (key) pending.delete(key); }

        // Wrap fetch
        if (window.fetch) {
          var origFetch = window.fetch;
          window.fetch = function (input, init) {
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            var key = track(url, 'fetch');
            return origFetch.apply(this, arguments).then(
              function (r) { untrack(key); return r; },
              function (e) { untrack(key); errors.push({ msg: 'fetch failed: ' + (e && e.message || e), src: url }); throw e; }
            );
          };
        }
        // Wrap XHR
        if (window.XMLHttpRequest) {
          var XHRProto = XMLHttpRequest.prototype;
          var origOpen = XHRProto.open, origSend = XHRProto.send;
          XHRProto.open = function (m, u) { this.__rlUrl = u; return origOpen.apply(this, arguments); };
          XHRProto.send = function () {
            var self = this;
            var key = track(self.__rlUrl, 'xhr');
            var done = function () { untrack(key); };
            self.addEventListener('loadend', done);
            return origSend.apply(this, arguments);
          };
        }
        // Watch script/link tags (added dynamically OR already in DOM)
        function watchNode(n) {
          if (!n || !n.tagName) return;
          var tag = n.tagName;
          var url = tag === 'SCRIPT' ? n.src : (tag === 'LINK' ? n.href : null);
          if (!url) return;
          var key = track(url, tag.toLowerCase());
          var done = function () { untrack(key); };
          var fail = function () {
            untrack(key);
            errors.push({ msg: tag.toLowerCase() + ' failed to load', src: url });
          };
          n.addEventListener('load', done, { once: true });
          n.addEventListener('error', fail, { once: true });
        }
        // Existing tags at parse time
        var existing = document.querySelectorAll('script[src], link[href]');
        for (var i = 0; i < existing.length; i++) watchNode(existing[i]);
        // Future tags
        if ('MutationObserver' in window) {
          new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
              var added = muts[i].addedNodes;
              for (var j = 0; j < added.length; j++) watchNode(added[j]);
            }
          }).observe(document.documentElement, { childList: true, subtree: true });
        }

        // Capture runtime errors
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target !== window && (e.target.src || e.target.href)) {
            errors.push({ msg: 'resource error', src: e.target.src || e.target.href });
          } else {
            errors.push({ msg: (e && e.message) || 'error', src: (e && e.filename) || '' });
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          errors.push({ msg: 'unhandledrejection: ' + ((r && (r.message || r.toString())) || ''), src: '' });
        });

        // Once React mounts anything real, hide the boot loader.
        var boot = document.getElementById('rl-boot');
        var diag = document.getElementById('rl-boot-diag');
        var copyBtn = document.getElementById('rl-boot-copy');
        var mo = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 1) {
            if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
            mo.disconnect();
            if (diagTimer) clearInterval(diagTimer);
          }
        });
        mo.observe(document.getElementById('root'), { childList: true, subtree: false });

        // Diagnostics: after 5s show slowest pending + errors, refresh 1s
        var diagTimer = null;
        function renderDiag() {
          if (!document.getElementById('rl-boot')) return;
          var now = Date.now();
          var items = [];
          pending.forEach(function (v) { items.push({ url: v.url, kind: v.kind, ms: now - v.start }); });
          items.sort(function (a, b) { return b.ms - a.ms; });
          var top = items.slice(0, 3);
          var html = '';
          if (top.length) {
            html += '<div style="margin-bottom:6px;opacity:.7;">Ожидаем ' + items.length + ' запрос(ов):</div>';
            for (var i = 0; i < top.length; i++) {
              html += '<div class="rl-row">' + (top[i].ms / 1000).toFixed(1) + 's · ' +
                top[i].kind + ' · ' + shortUrl(top[i].url) + '</div>';
            }
          }
          if (errors.length) {
            html += '<div style="margin-top:8px;margin-bottom:4px;opacity:.7;">Ошибок: ' + errors.length + '</div>';
            var lastErr = errors.slice(-3);
            for (var k = 0; k < lastErr.length; k++) {
              html += '<div class="rl-row rl-err">' + lastErr[k].msg +
                (lastErr[k].src ? ' — ' + shortUrl(lastErr[k].src) : '') + '</div>';
            }
            copyBtn.style.display = 'inline-block';
          }
          diag.innerHTML = html;
          diag.style.display = html ? 'block' : 'none';
        }
        setTimeout(function () {
          renderDiag();
          diagTimer = setInterval(renderDiag, 1000);
        }, 5000);

        copyBtn.addEventListener('click', function () {
          var lines = [];
          lines.push('URL: ' + location.href);
          lines.push('UA: ' + navigator.userAgent);
          lines.push('Elapsed: ' + ((Date.now() - startTs) / 1000).toFixed(1) + 's');
          lines.push('');
          lines.push('Errors (' + errors.length + '):');
          errors.forEach(function (e) { lines.push('- ' + e.msg + (e.src ? ' [' + e.src + ']' : '')); });
          lines.push('');
          lines.push('Pending (' + pending.size + '):');
          pending.forEach(function (v) {
            lines.push('- ' + ((Date.now() - v.start) / 1000).toFixed(1) + 's ' + v.kind + ' ' + v.url);
          });
          var text = lines.join('\n');
          var ok = false;
          try {
            if (navigator.clipboard && window.isSecureContext) {
              navigator.clipboard.writeText(text);
              ok = true;
            }
          } catch (e) {}
          if (!ok) {
            try {
              var ta = document.createElement('textarea');
              ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
              document.body.appendChild(ta); ta.select(); document.execCommand('copy');
              document.body.removeChild(ta); ok = true;
            } catch (e) {}
          }
          copyBtn.textContent = ok ? 'Скопировано ✓' : 'Не удалось скопировать';
          setTimeout(function () { copyBtn.textContent = 'Скопировать ошибки'; }, 2000);
        });

        // If boot loader is still visible after 20s — silently reload once per session.
        setTimeout(function () {
          if (!document.getElementById('rl-boot')) return;
          var already = false;
          try { already = sessionStorage.getItem('rl-chunk-reloaded') === '1'; } catch (e) {}
          if (already) return;
          try { sessionStorage.setItem('rl-chunk-reloaded', '1'); } catch (e) {}
          location.reload();
        }, 20000);

        // ChunkLoadError handler: dynamic import() failed. Auto-reload once.
        function handleChunkError(err) {
          var msg = (err && (err.message || err.toString())) || '';
          var isChunk = /ChunkLoadError|Loading chunk|Loading CSS chunk|Failed to fetch dynamically imported module|Importing a module script failed/i.test(msg);
          if (!isChunk) return;
          var already = false;
          try { already = sessionStorage.getItem('rl-chunk-reloaded') === '1'; } catch (e) {}
          if (already) return;
          try { sessionStorage.setItem('rl-chunk-reloaded', '1'); } catch (e) {}
          console.warn('[RL] chunk load failed, reloading once:', msg);
          location.reload();
        }
        window.addEventListener('error', function (e) {
          handleChunkError(e && (e.error || { message: e.message }));
        });
        window.addEventListener('unhandledrejection', function (e) {
          handleChunkError(e && e.reason);
        });
        window.addEventListener('load', function () {
          setTimeout(function () {
            try { sessionStorage.removeItem('rl-chunk-reloaded'); } catch (e) {}
          }, 5000);
        });
      })();
    </script>
